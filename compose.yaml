version: '3.8'
services:
  microdb:
    build:
      context: ./Docker-files/db
    image: chandanakilarapu/microdb:AC
    container_name: microdb
    environment:
      MYSQL_ROOT_PASSWORD: vprodbpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  microcache01:
    image: memcached
    container_name: microcache01
    ports:
      - "11211:11211"

  micromq01:
    image: rabbitmq
    container_name: micromq01
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"

  microapp:
    build:
      context: ./Docker-files/app
    image: chandanakilarapu/microapp:AC
    container_name: microapp
    ports:
      - "8080:8080"
    volumes:
      - app_data:/usr/local/tomcat/webapps

  microweb:
    build:
      context: ./Docker-files/web
    image: chandanakilarapu/microweb:AC
    container_name: microweb
    ports:
      - "80:80"

volumes:
  db_data: {}
  app_data: {}
